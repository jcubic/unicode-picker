name: Publish to npm

# Publish when a GitHub Release is published (always attached to a tag).
# Draft releases don't fire this; only publishing does.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # required for npm trusted publishing (OIDC) + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      # `npm ci` runs the `prepare` script, which generates providers/data.
      - run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      # Trusted publishing needs npm >= 11.5.1, newer than the npm bundled with
      # Node 24. Auth is via OIDC — no NODE_AUTH_TOKEN / NPM_TOKEN.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Publish
        run: npm publish
