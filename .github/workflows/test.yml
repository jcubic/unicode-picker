name: Tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # `npm ci` runs the `prepare` script, which generates providers/data.
      - run: npm ci
      - name: Lint (ESLint + Prettier)
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Unit tests with coverage
        run: npm run coverage

      - name: Build
        run: npm run build

      # The E2E smoke test drives the built demo in the Chrome pre-installed on
      # the runner (Playwright `channel: 'chrome'`), so no browser download.
      - name: E2E smoke test
        run: npm run test:e2e

      - name: Publish coverage to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: coverage/lcov.info
